name: Build Single-File Executable

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      compression:
        description: 'Compression method (bz2, gz, xz)'
        required: false
        default: 'bz2'

jobs:
  build-sfx:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create build directory
      run: mkdir -p sfx dist

    - name: Install dependencies to bundle
      run: |
        pip install -t sfx/ -r requirements.txt

    - name: Copy bratt modules
      run: |
        cp -r bratt/ sfx/bratt/

    - name: Optimize bundle
      run: |
        # Remove cache files
        find sfx/ -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
        find sfx/ -type f -name "*.pyc" -delete
        find sfx/ -type d -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
        find sfx/ -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true

        # Remove test files
        find sfx/ -type d -name tests -exec rm -rf {} + 2>/dev/null || true
        find sfx/ -type d -name test -exec rm -rf {} + 2>/dev/null || true

    - name: Run build script
      run: |
        chmod +x scripts/make-sfx.sh
        ./scripts/make-sfx.sh ${{ github.event.inputs.compression || 'bz2' }}

    - name: Calculate file size
      run: |
        ls -lh dist/bratt-sfx.py
        echo "SFX_SIZE=$(stat -c%s dist/bratt-sfx.py)" >> $GITHUB_ENV

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: bratt-sfx
        path: dist/bratt-sfx.py

    - name: Upload to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: dist/bratt-sfx.py
        token: ${{ github.token }}
